conky.config = {
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 10,
    minimum_width = 220,
    maximum_width = 220,
    background = true,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    default_color = '000000',
    color1 = '000000',
    update_interval = 2,
    cpu_avg_samples = 2,
    no_buffers = true,
};

