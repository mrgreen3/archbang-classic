conky.config = {
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 10,
    minimum_width = 220,
    maximum_width = 220,
    background = true,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    default_color = 'ffffff',
    color1 = 'e0952a',
    update_interval = 2,
    cpu_avg_samples = 2,
    no_buffers = true,
};

conky.text = [[
${color1}${font DejaVu Sans:bold:size=11}ArchBang Classic${font}${color}
${color1}${hr}${color}
Host    ${alignr}${nodename}
Kernel  ${alignr}${kernel}
Uptime  ${alignr}${uptime_short}
CPU     ${alignr}${cpu}%
RAM     ${alignr}${mem} / ${memmax}
Disk /  ${alignr}${fs_used /} / ${fs_size /}

${color1}${font DejaVu Sans Mono:bold:size=9}KEYS${font}${color}
${color1}${hr}${color}
Super+Return  ${alignr}Terminal
Super+Space   ${alignr}Launcher
Super+w       ${alignr}Web
Super+e       ${alignr}Files
Super+1-4     ${alignr}Desktop
Super+l       ${alignr}Lock
]];
